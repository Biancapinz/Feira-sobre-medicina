<!doctype html>
<html lang="pt-br">
<head>
  <!-- Meta Tags Essenciais -->
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">

  <!-- Título da Página -->
  <title>Cards com Busca</title>

  <!-- Bootstrap CSS -->
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.0.2/dist/css/bootstrap.min.css" rel="stylesheet">

  <!-- Font Awesome -->
  <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/5.15.4/css/all.min.css" rel="stylesheet">

  <!-- Estilo personalizado -->
  <link rel="stylesheet" href="introduçao.css">
</head>
<body>

  <!-- Barra de pesquisa fixa -->
  <header>
    <div class="nav">
      <div class="search-box">
        <input class="search-txt" type="text" placeholder="Faça sua pesquisa">
        <a class="search-btn" href="#"><i class="fas fa-search"></i></a>
      </div>
    </div>
  </header>

  <!-- Conteúdo principal -->
  <main>
    <div class="container mt-5 pt-5">
      <div class="card-group">
        <div class="card">
          <img src="https://pub-c2c1d9230f0b4abb9b0d2d95e06fd4ef.r2.dev/sites/42/2016/10/HCPA2.jpg" class="card-img-top" alt="Imagem 1">
          <div class="card-body">
            <h5 class="card-title">Card 1</h5>
            <p class="card-text">Este é um card com um pouco mais de conteúdo para testar o layout responsivo.</p>
            <p class="card-text"><small class="text-muted">Atualizado há 3 minutos</small></p>
          </div>
        </div>
        <div class="card">
          <img src="https://gehosp.com.br/wp-content/uploads/2019/03/Hospital.jpg" class="card-img-top" alt="Imagem 2">
          <div class="card-body">
            <h5 class="card-title">Card 2</h5>
            <p class="card-text">Este card tem texto adicional como exemplo.</p>
            <p class="card-text"><small class="text-muted">Atualizado há 3 minutos</small></p>
          </div>
        </div>
        <div class="card">
          <img src="https://www.correiodopovo.com.br/image/contentid/policy:1.1281857:1678996734/465326.JPG?a=3%3A2&$p$a=03a6f05" class="card-img-top" alt="Imagem 3">
          <div class="card-body">
            <h5 class="card-title">Card 3</h5>
            <p class="card-text">Card com mais conteúdo para exibir diferentes alturas e manter alinhamento.</p>
            <p class="card-text"><small class="text-muted">Atualizado há 3 minutos</small></p>
          </div>
        </div>
      </div>
    </div>
  </main>

  <!-- Bootstrap JS (Bundle inclui Popper) -->
  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.0.2/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
